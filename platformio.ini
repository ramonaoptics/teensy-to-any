;PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ---------------------------------------------------------------------------
; Host (native) test env for the clean-room lib/arduino_compat logic.
; Runs with no hardware:  pio test -e native
; ---------------------------------------------------------------------------
[env:native]
platform = native
build_src_filter = -<*>
build_flags =
    -std=gnu++14
    -I lib/arduino_compat/src

; ---------------------------------------------------------------------------
; Bare-metal (no Arduino framework) Teensy 4.0 build — WORK IN PROGRESS.
; Not in the CI matrix until it links + boots on hardware. See
; move_away_from_arduino_framework.md and docs/migration/.
; ---------------------------------------------------------------------------
[env:teensy40_bare]
platform = teensy
board = teensy40
; no `framework =` line -> PlatformIO uses its bare-metal ARM path
; TinyUSB is a proper PIO library (root library.json) -> pin natively here.
; (The NXP CMSIS device + ARM CMSIS core are monorepo subpaths PIO can't pin;
;  those are fetched by tools/fetch_mcux.py.)
lib_deps =
    https://github.com/hathach/tinyusb.git#0.18.0
board_build.ldscript = boards/teensy40_bare/imxrt1062_t40.ld
extra_scripts =
    pre:tools/fetch_mcux.py
    post:boards/teensy40_bare/bare_flags.py
build_flags =
    -mfloat-abi=hard
    -mfpu=fpv5-d16
    -D__IMXRT1062__
    -DARDUINO_TEENSY40
    -DCPU_MIMXRT1062DVL6A
    -I$PROJECT_DIR/config        ; tusb_config.h (not auto-found in include/)
build_src_filter =
    -<*>
    +<../boards/teensy40_bare/>
    +<../vendor/mcux/system_MIMXRT1062.c>

[env:teensy40]
platform = teensy
board = teensy40
framework = arduino
upload_protocol = teensy-cli
; While we use the upstream libray, their print statement messes
; with our protocol
; https://github.com/Richard-Gemmell/teensy4_i2c/issues/38
; https://github.com/Richard-Gemmell/teensy4_i2c.git
lib_deps =
    https://github.com/ramonaoptics/teensy4_i2c.git#our_mods
    https://github.com/FastLED/FastLED.git#3.10.3
build_flags =
    !python versioneer.py
build_src_filter =
    +<*.c>
    +<*.h>
    +<*.cpp>
    +<*.hpp>
    -<examples/*>

[env:teensy40_fastled]
extends = env:teensy40
build_src_filter =
    +<*.c>
    +<*.h>
    +<*.cpp>
    +<*.hpp>
    -<examples/**>
    +<examples/fastled_demo/*>

[env:teensy40_blinker]
extends = env:teensy40
build_src_filter =
    +<*.c>
    +<*.h>
    +<*.cpp>
    +<*.hpp>
    -<examples/**>
    +<examples/blinker/*>

[env:teensy40_fan_hub]
extends = env:teensy40
build_src_filter =
    +<*.c>
    +<*.h>
    +<*.cpp>
    +<*.hpp>
    -<examples/**>
    +<examples/fan_hub/*>

[env:teensy40_fan_hub_default_off]
extends = env:teensy40
build_src_filter =
    +<*.c>
    +<*.h>
    +<*.cpp>
    +<*.hpp>
    -<examples/**>
    +<examples/fan_hub_default_off/*>
